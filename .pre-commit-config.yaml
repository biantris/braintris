repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm exec --no -- eslint
        language: system
        files: \.[jt]sx?$
      - id: prettier
        name: Prettier
        entry: npm exec --no -- prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, css, markdown]
