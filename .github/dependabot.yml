version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '01:00'
    open-pull-requests-limit: 10
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      react:
        patterns:
          - react
          - react-dom

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
